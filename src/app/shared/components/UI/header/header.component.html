<header class="header">
  <img
    class="img"
    [ngSrc]="'./assets/images/logo-britannia-compressed.png'"
    [width]="50"
    [height]="50"
    alt="britannia-logo"
  />

  <h1 class="title">{{ title }}</h1>

  <div class="button-wrapper">
    @if (email(); as address) {
      <span class="account-email">{{ address }}</span>

      <app-button
        [translateKey]="'auth.signOut'"
        [icon]="'logout'"
        (clicked)="signOut()"
      ></app-button>
    }

    <!--    <svg-->
    <!--      width="30"-->
    <!--      height="20"-->
    <!--      viewBox="0 0 60 40"-->
    <!--      xmlns="http://www.w3.org/2000/svg"-->
    <!--    >-->
    <!--      <rect width="30" height="20" fill="#FFFFFF" />-->
    <!--      <rect y="20" width="60" height="20" fill="#DC143C" />-->
    <!--    </svg>-->
    <mat-slide-toggle
      (change)="switchLanguage()"
      [hideIcon]="true"
      [color]="'#1c4794'"
    >
      <svg width="30" height="20" viewBox="0 0 60 40">
        <rect width="60" height="40" fill="#012169" />
        <path d="M0 0 L60 40 M60 0 L0 40" stroke="#fff" stroke-width="8" />
        <path d="M0 0 L60 40 M60 0 L0 40" stroke="#C8102E" stroke-width="5" />
        <path d="M30 0 v40 M0 20 h60" stroke="#fff" stroke-width="13.3" />
        <path d="M30 0 v40 M0 20 h60" stroke="#C8102E" stroke-width="8" />
      </svg>
    </mat-slide-toggle>
  </div>
</header>
