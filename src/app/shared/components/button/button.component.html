<button
  mat-raised-button
  class="button"
  [class.button--secondary]="variant() === 'secondary'"
  [class.button--danger]="variant() === 'danger'"
  [type]="type()"
  [disabled]="disabled()"
  (click)="emitClicked()"
>
  @if (icon()) {
  <mat-icon class="material-symbols-outlined">{{ icon() }}</mat-icon>
  }

  {{ translateKey() | translate }}
</button>
