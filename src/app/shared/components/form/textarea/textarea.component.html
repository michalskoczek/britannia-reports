<mat-form-field appearance="outline">
  <mat-label>{{ label() | translate }}</mat-label>
  <textarea
    matInput
    [formControl]="control"
    [placeholder]="placeholder() | translate"
    [required]="required()"
    [rows]="rows()"
    [errorStateMatcher]="errorStateMatcher"
    (blur)="onBlur()"
  ></textarea>

  <mat-error>{{ errorMessage() | translate }}</mat-error>
</mat-form-field>
