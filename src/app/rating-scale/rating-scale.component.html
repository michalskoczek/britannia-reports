<div class="row">
  <div class="col-2">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="percent">
        <th mat-header-cell *matHeaderCellDef>Procent</th>
        <td mat-cell *matCellDef="let element">{{ element.percent }}</td>
      </ng-container>

      <ng-container matColumnDef="mark">
        <th mat-header-cell *matHeaderCellDef>Ocena</th>
        <td mat-cell *matCellDef="let element">{{ element.mark }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <app-special-marks class="col-10"></app-special-marks>
</div>
