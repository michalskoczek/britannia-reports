<div class="row mt-5">
  <div class="col-12 mb-4">
    <h2 class="subtitle">{{ "Oceny" | translate }}</h2>
  </div>
</div>

<div class="row">
  <div class="col-2">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="percent">
        <th mat-header-cell *matHeaderCellDef>
          {{ "Procent" | translate }}
        </th>
        <td mat-cell *matCellDef="let element">{{ element.percent }}</td>
      </ng-container>

      <ng-container matColumnDef="mark">
        <th mat-header-cell *matHeaderCellDef>{{ "Ocena" | translate }}</th>
        <td mat-cell *matCellDef="let element">{{ element.mark }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
  <app-special-marks class="col-10"></app-special-marks>
</div>
