<div class="container pb-5 my-4">
  <div class="row">
    <div class="col-12">
      <app-form-wrapper [sectionTitle]="'basicInformation'">
        <app-teddy-eddie-form [form]="form" (ageSelected)="setTableTE($event)"></app-teddy-eddie-form>
      </app-form-wrapper>
    </div>
  </div>
  <div class="row mt-4">
    <div class="col-12">
      <app-section-title [sectionTitle]="'teddyEddie.englishImmersion'"></app-section-title>

      <app-teddy-eddie-table
        [formArray]="teddyEddieArray"
        [courses]="courses"
        [courseLevels]="courseLevelTE"
        [books]="booksToChoosingTE"
      ></app-teddy-eddie-table>
    </div>
  </div>

  <div class="row mt-4">
    <div class="col-12">
      <app-section-title [sectionTitle]="'teddyEddie.cambridgePath'"></app-section-title>

      <app-cambridge-path-table
        [formArray]="developmentLanguageSkillsArray"
        [courses]="courses"
        [languageLevels]="languageLevels"
        [certificationPurpose]="certificationPurpose"
        [schoolExams]="schoolExamsTE"
      ></app-cambridge-path-table>
    </div>
  </div>

  <div class="row generate-btn">
    <div class="col-12 d-flex justify-content-end">
      <app-button [translateKey]="'PDF'" (clicked)="downloadPDF()" [icon]="'download'">
        {{ 'downloadPDF' | translate }}
      </app-button>
    </div>
  </div>
</div>
