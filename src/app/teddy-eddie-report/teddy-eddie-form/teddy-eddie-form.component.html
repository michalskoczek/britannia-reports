<app-input
  [(model)]="form.studentName"
  [label]="'nameAndLastNameStudent'"
  [required]="true"
  [errorMessage]="'error.fieldIsRequired'"
></app-input>

<app-select
  [model]="form.age"
  [label]="'age'"
  [required]="true"
  [itemList]="ageTE"
  [errorMessage]="'error.fieldIsRequired'"
  (modelChange)="onAgeChange($event)"
></app-select>

<app-date
  [(model)]="form.date"
  [label]="'date'"
  [required]="true"
  [errorMessage]="'error.fieldIsRequired'"
></app-date>
