<app-form-wrapper [sectionTitle]="'students.picker.sectionTitle'">
  <p class="student-picker-lead">{{ 'students.picker.lead' | translate }}</p>

  @if (loading()) {
    <p class="student-picker-note">{{ 'students.picker.loading' | translate }}</p>
  } @else if (loadFailureKey(); as key) {
    <div class="student-picker-failure" role="alert">
      <p class="student-picker-error">{{ key | translate }}</p>

      <!--
        `[type]` is explicit because this panel is mounted inside the report's
        `<form>`, whose submit handler downloads a PDF — and `app-button`
        defaults to a value HTML resolves to *submit*.
      -->
      <app-button
        [translateKey]="'students.picker.retry'"
        [icon]="'refresh'"
        [type]="'button'"
        [variant]="'secondary'"
        (clicked)="reload()"
      ></app-button>
    </div>
  } @else if (students().length === 0) {
    <p class="student-picker-note">{{ 'students.picker.empty' | translate }}</p>
  } @else {
    <!--
      The option labels are student names, and `app-select` renders every label
      through the `translate` pipe. `ngx-translate` returns an unknown key
      verbatim, so a name comes back as itself — relied on here rather than
      accidental. A name that ever collided with a translation key would render
      as that key's text, which is why the roster's own list prints
      `student.identity.studentName` directly instead.

      Bound to `(selectionChange)`, not to the control's `valueChanges`: it stays
      silent on a programmatic write, so the revert after a dismissed
      confirmation cannot ask the same question twice.
    -->
    <app-select
      class="student-picker-select"
      [formControl]="studentControl"
      [label]="'students.picker.selectLabel'"
      [placeholder]="'students.picker.selectPlaceholder'"
      [itemList]="options()"
      (selectionChange)="pick($event)"
    ></app-select>
  }

  <!--
    Outside the state chain above on purpose: "this student isn't in my roster
    yet" is exactly what an empty roster means, and a failed load is no reason to
    refuse an add — the create path does not depend on the list being on screen.
  -->
  @if (quickAddOpen()) {
    <!--
      Enter is caught on the way out of the fields, because this panel is mounted
      inside the report's `<form>`, whose submit handler downloads a PDF.
    -->
    <div class="student-picker-quick-add">
      <app-student-form
        [form]="quickAddForm"
        [failureKey]="quickAddFailureKey()"
        (keydown.enter)="onQuickAddEnter($event)"
      ></app-student-form>

      <div class="student-picker-quick-add-actions">
        <!--
          `[type]` is explicit on both: `app-button` defaults to a value HTML
          resolves to *submit*, and the enclosing form is the report's.
        -->
        <app-button
          class="student-picker-quick-add-submit"
          [translateKey]="'students.picker.quickAdd.submit'"
          [icon]="'person_add'"
          [type]="'button'"
          [disabled]="saving()"
          (clicked)="submitQuickAdd()"
        ></app-button>

        <app-button
          [translateKey]="'students.picker.quickAdd.cancel'"
          [icon]="'close'"
          [type]="'button'"
          [variant]="'secondary'"
          [disabled]="saving()"
          (clicked)="cancelQuickAdd()"
        ></app-button>
      </div>
    </div>
  } @else {
    <app-button
      class="student-picker-quick-add-toggle"
      [translateKey]="'students.picker.quickAdd.toggle'"
      [icon]="'person_add'"
      [type]="'button'"
      [variant]="'secondary'"
      (clicked)="openQuickAdd()"
    ></app-button>
  }
</app-form-wrapper>
