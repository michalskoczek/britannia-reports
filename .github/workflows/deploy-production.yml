# Deploy master to production (britannia-reports) — fully automatic on every push to master.
#
# master only moves through release PRs from develop that passed the required CI checks
# (ruleset protect-master-develop), and the same commit has already run on staging.
# Order: Firestore rules first, then hosting, then a smoke test against the live site.
#
# Credentials: the `production` GitHub environment (deployment branch: master only) holds
# FIREBASE_SERVICE_ACCOUNT for the production project. Rollback: Firebase Console → Hosting →
# release history → roll back; rules roll back by redeploying the previous firestore.rules.
name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  FIREBASE_TOOLS_VERSION: '15.26.0'
  FIREBASE_PROJECT: britannia-reports
  SITE_URL: https://britannia-reports.web.app

jobs:
  deploy:
    name: Build and deploy to production
    # A manual run from any other branch would ship that branch to production.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ env.FIREBASE_TOOLS_VERSION }}
      - run: npm install -g firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }}

      - name: Build (production configuration)
        run: npm run build
      - name: Build output exists and targets production only
        run: |
          test -f dist/browser/index.html
          grep -lq '90de33b8569b522a060137' dist/browser/*.js
          ! grep -lq 'britannia-reports-staging' dist/browser/*.js

      - name: Service account credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$SERVICE_ACCOUNT" || { echo "FIREBASE_SERVICE_ACCOUNT is not set in the production environment" >&2; exit 1; }
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # src/CLAUDE.md: run the rules suite before deploying rules. The rest of CI (lint, builds,
      # unit, e2e) already gated the PR through the ruleset's required checks; the rules suite is
      # repeated here because a rules deploy is the one step that cannot be rolled back with hosting.
      - name: Firestore rules tests
        run: npm run test:rules
      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive
      - name: Deploy hosting
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT" --non-interactive

      - name: Smoke test — the site serves this build
        run: |
          main=$(ls dist/browser | grep -E '^main-.*\.js$')
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "$SITE_URL/" | grep -q "$main"; then
              echo "Live site serves $main"
              exit 0
            fi
            sleep 10
          done
          echo "Live site does not reference $main after deploy" >&2
          exit 1

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
